name: Bug report
description: Report a reproducible problem with the indicator
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Never attach access tokens, private URLs, or home-network identifiers.
  - type: input
    id: gnome-version
    attributes:
      label: GNOME Shell version
      placeholder: "50.4"
    validations:
      required: true
  - type: input
    id: home-assistant-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Enable the extension
        2. Select Refresh now
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, private URLs, public IP addresses, entity names, and home-network identifiers.
      render: shell
